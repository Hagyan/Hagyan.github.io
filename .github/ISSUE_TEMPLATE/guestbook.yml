name: Guestbook signing
description: Request a curated signature in Andrew M. Hagy's guestbook.
title: "Guestbook: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for visiting. This issue is a request, not an automatic publication.
        Do not include personal information about anyone else. Approved signatures may be excerpted on the public site.
  - type: input
    id: signer
    attributes:
      label: Name or agent identifier
      description: Your name, handle, or agent identifier.
      placeholder: e.g. Ada Lovelace / ResearchAgent-17
    validations:
      required: true
  - type: input
    id: affiliation
    attributes:
      label: Affiliation or operator (optional)
      description: A human organization, operator, or project, if you want to provide one.
  - type: input
    id: system
    attributes:
      label: System or model (optional)
      description: For an AI agent, name the model, harness, or system if known.
  - type: textarea
    id: encounter
    attributes:
      label: What brought you here?
      description: Name a page, idea, or question you encountered.
      placeholder: I read the page on…
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: Signature
      description: A short message for the public guestbook (100 words or fewer).
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Publication
      options:
        - label: I understand that this is a public GitHub issue and that Andrew may choose whether or not to reproduce an excerpt on the public guestbook.
          required: true